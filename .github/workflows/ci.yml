name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # PostgreSQL real para os testes da API (sem Supabase): o schema vem das
    # migrations de db/migrations, aplicadas por `pnpm db:migrate`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faroai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciais descartáveis, só deste job (service container efêmero).
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/faroai_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @ford/api typecheck:test
      - name: Aplica as migrations no PostgreSQL de teste
        run: pnpm db:migrate
      - run: pnpm --filter @ford/api test:coverage
      - name: Publica evidências dos testes (JUnit + cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/test-results

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    env:
      ML_SERVICE_TOKEN: ci-only-ml-service-token-0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.scripts.train_models 1500
      - run: pytest -q

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install semgrep
      - run: semgrep scan --config auto --error apps/api apps/web apps/mobile services/ml

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript production dependencies
        run: pnpm audit --prod --audit-level high --json > pnpm-audit.json
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r services/ml/requirements.txt -f json -o pip-audit.json
        continue-on-error: true
      - name: Publish audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audits
          path: |
            pnpm-audit.json
            pip-audit.json

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
