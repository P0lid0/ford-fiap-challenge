title = "Ford FIAP — gitleaks"
[allowlist]
description = "Permitir placeholders no .env.example"
paths = [
  ".env.example",
  "README.md",
  "DECISIONS.md",
  "docs/SETUP.md",
]

[[rules]]
id = "jwt-embutido"
description = "JWT embutido no código (token de serviço ou de sessão commitado)"
regex = '''eyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'''
tags = ["jwt"]
